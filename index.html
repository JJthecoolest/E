<!DOCTYPE html>
<html>
<head>
<title>New Tab</title>
</head>

<body>

<div class="topnav">
  <input type="password" placeholder="Type Here" id="pass">
</div>

<button onclick="enter()">enter</button>

<script>
const PASS_HASH = "663f73f8af157c158248e72eb2d6548f7219b4231609b732ccc6484522628c6d";
const gamePromise = fetch(
  "https://cdn.jsdelivr.net/gh/JJthecoolest/E@master/crash.html?t=" + Date.now()
).then(r => r.text());

// ----------------------------

async function sha256(text) {
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(hash))
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

async function Opensite() {
  const win = window.open("about:blank", "_blank");

  const response = await fetch(
    "https://cdn.jsdelivr.net/gh/meme-sir/gn-math@master/singlefile.html?t=" + Date.now()
  );

  const text = await response.text();

  win.document.open();
  win.document.write(text);
  window.close();
}

async function loadGameHereFast() {
  const html = await gamePromise;
  document.open();
  document.write(html);
  document.close();
}

async function enter() {
  const input = document.getElementById("pass").value;
  const hash = await sha256(input);

  if (hash === PASS_HASH) {
    Opensite();
  } else {
    window.close();
  }
}
</script>

</body>
</html>
